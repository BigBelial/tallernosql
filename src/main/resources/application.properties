spring.application.name=claseJava

# MongoDB: por defecto se conecta a un Mongo local (el del docker-compose.yml).
# Para usar el cluster de Atlas de la clase se definen las variables MONGODB_URI y MONGODB_DATABASE antes de arrancar.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:library}

# Redis (cache): por defecto se conecta a un Redis local (el del docker-compose.yml).
# Para usar el Redis de Upstash de la clase se define la variable REDIS_URL (rediss://default:<token>@<host>:6379).
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.cache.type=redis
